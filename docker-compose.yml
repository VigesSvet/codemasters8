services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saq
      POSTGRES_PASSWORD: saq
      POSTGRES_DB: saq
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saq"]
      interval: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://saq:saq@db:5432/saq
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 5180"
    environment:
      API_PROXY: http://api:8000
    # ../shared из /app → /shared: фронтенд импортирует общую модель риска и сид
    volumes: [./frontend:/app, /app/node_modules, ./shared:/shared:ro]
    ports: ["5180:5180"]
    depends_on: [api]

volumes:
  pgdata:
