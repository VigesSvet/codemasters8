# Проверка качества(ТЗ §8): линтеры, типы, автотесты бэкенда и фронтенда, сквозной сценарий, сборка, аудит зависимостей.
# Шаги вызывают цели корневого Makefile - локально те же проверки: make check(и make audit).
# Сеть тестам не нужна: внешние API и модель распознавания речи подменены.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Бэкенд - ruff, pytest(SQLite), сценарий, pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      # faster-whisper в тестах не загружает модель(conftest._no_asr); на случай ошибки - без похода на HuggingFace
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      # как в backend/Dockerfile: Tesseract с языками rus и kaz(OCR скриншотов), ffmpeg(кадры и звук видео), prlimit
      - name: Tesseract(rus, kaz), ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-rus tesseract-ocr-kaz ffmpeg util-linux
          tesseract --version | head -1
          tesseract --list-langs
          ffmpeg -version | head -1

      # версия - как в образе API(python:3.12-slim-trixie); кэш - каталог загрузок pip, его использует и pip окружения
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Зависимости - make setup-backend
        run: make setup-backend PYTHON=python

      - name: Линтер - make lint-backend
        run: make lint-backend

      - name: Сквозной сценарий README - make e2e
        run: make e2e

      - name: Автотесты - make test-backend
        run: make test-backend

      # известные уязвимости(база PyPI) ровно в тех версиях, что поставил pip: requirements*.txt задают только нижние
      # границы. pip-audit - в отдельном окружении, чтобы он и его зависимости не попали в проверяемый список
      - name: Аудит зависимостей - make audit-backend
        run: make audit-backend PYTHON=python AUDIT_VENV="$RUNNER_TEMP/pip-audit"

  frontend:
    name: Фронтенд - oxlint, tsc, vitest, сборка, npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # vitest 5 требует Node ^22.12 || ^24 || >=26; 24 - текущая LTS. npm в PATH - цели Makefile идут без Docker
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Зависимости - make setup-frontend
        run: make setup-frontend

      # падает только на ошибках, предупреждения - в журнале
      - name: Линтер - make lint-frontend
        run: make lint-frontend

      - name: Проверка типов - make typecheck
        run: make typecheck

      - name: Автотесты - make test-frontend
        run: make test-frontend

      - name: Сборка - make build
        run: make build

      - name: Аудит зависимостей сборки - make audit-frontend
        run: make audit-frontend
