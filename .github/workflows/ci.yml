# Проверка качества (ТЗ §8): автотесты бэкенда и фронтенда, типы, линтер, сборка.
# Те же команды, что в README «Тесты»; сеть тестам не нужна — внешние API и модель распознавания речи подменены.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Бэкенд — pytest (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      # faster-whisper в тестах не загружает модель (conftest._no_asr); на случай ошибки — без похода на HuggingFace
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      # как в backend/Dockerfile: Tesseract с языками rus и kaz (OCR скриншотов), ffmpeg (кадры и звук видео), prlimit
      - name: Tesseract (rus, kaz), ffmpeg
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-rus tesseract-ocr-kaz ffmpeg util-linux
          tesseract --version | head -1
          tesseract --list-langs
          ffmpeg -version | head -1

      # версия - как в образе API(python:3.12-slim-trixie)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Зависимости
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest
        run: python -m pytest -q

      # известные уязвимости(база PyPI) ровно в тех версиях, что поставил pip: requirements*.txt задают только нижние
      # границы. pip-audit - в отдельном окружении, чтобы он и его зависимости не попали в проверяемый список
      - name: Аудит зависимостей - pip-audit
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/python" -m pip install --quiet pip-audit
          python -m pip freeze --exclude-editable \
            | "$RUNNER_TEMP/audit/bin/pip-audit" -r /dev/stdin --no-deps --disable-pip --progress-spinner off

  frontend:
    name: Фронтенд — tsc, vitest, oxlint, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # vitest 5 требует Node ^22.12 || ^24 || >=26; 24 — текущая LTS
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Зависимости
        run: npm ci --no-audit --no-fund

      - name: Проверка типов
        run: npx tsc -b

      - name: vitest
        run: npm test

      # падает только на ошибках, предупреждения — в журнале
      - name: oxlint
        run: npx oxlint src

      - name: Сборка
        run: npx vite build
